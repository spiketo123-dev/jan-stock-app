<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>JAN在庫・発注アプリ</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0 auto;padding:14px 12px 40px;max-width:720px;background:#f4f6f8;color:#20252b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
h1{font-size:23px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 12px}.sub,.note,.small{font-size:12px;color:#68717b;line-height:1.5}
.card{background:white;border:1px solid #e2e6ea;border-radius:14px;padding:15px;margin:12px 0}
label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}
input{width:100%;min-height:45px;border:1px solid #cbd2d9;border-radius:9px;padding:10px;font-size:17px;background:white}
button{border:0;border-radius:10px;padding:11px 14px;min-height:43px;font-size:14px;font-weight:650;background:#1769aa;color:white}
button.secondary{background:#e9eef3;color:#263442}button.danger{background:#b83232}button:disabled{opacity:.45}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}
#reader{max-width:480px;margin:12px auto;overflow:hidden;border-radius:10px}
.status{font-size:13px;color:#1769aa;min-height:20px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.product{border-top:1px solid #edf0f2;padding:11px 0}.product strong{display:block;font-size:15px;overflow-wrap:anywhere;margin-bottom:4px}
.meta{font-size:13px;color:#59636e;line-height:1.6}.product-actions{display:flex;gap:7px;margin-top:7px}.product-actions button{min-height:35px;padding:6px 12px;font-size:13px}
.summary{background:#f1f6fa;border-radius:10px;padding:11px;margin-top:12px;font-weight:700;font-size:14px}.empty{color:#7a838c;font-size:14px;padding:12px 0}
</style>
</head>
<body>
<h1>JAN在庫・発注アプリ</h1><p class="sub">商品登録・在庫管理・倉庫向け発注一覧</p>

<section class="card">
<h2>① JANコード読み取り</h2>
<button id="scanBtn">カメラでJANをスキャン</button>
<div id="reader" hidden></div>
<p class="note">カメラの使用を許可してください。読み取り後は一時停止します。次の商品は「次の商品をスキャン」を押してください。</p>
<div class="actions"><button id="nextBtn" class="secondary" disabled>次の商品をスキャン</button><button id="closeBtn" class="secondary" disabled>カメラを閉じる</button></div>
<div id="scanStatus" class="status"></div>
</section>

<section class="card">
<h2>② 商品登録・入力</h2>
<label for="jan">JANコード</label>
<div class="actions" style="margin-top:0"><input id="jan" inputmode="numeric" placeholder="JANコードを入力"><button id="lookupBtn">検索</button></div>
<label for="name">商品名</label><input id="name" placeholder="商品名を入力">
<div class="grid"><div><label for="stock">在庫数</label><input id="stock" type="number" min="0" step="1" value="0"></div><div><label for="order">発注数</label><input id="order" type="number" min="0" step="1" value="0"></div></div>
<div class="actions"><button id="saveBtn">登録・更新する</button><button id="clearBtn" class="secondary">入力をクリア</button></div>
<div id="formStatus" class="status"></div><p class="note">同じJANコードを登録すると既存の商品情報を更新します。</p>
</section>

<section class="card">
<h2>③ 商品一覧</h2>
<label for="search">商品名・JANコードで検索</label><input id="search" placeholder="検索ワードを入力">
<div id="products"></div>
<div class="actions"><button id="csvBtn" class="secondary">商品一覧をCSV出力</button><button id="backupBtn" class="secondary">バックアップ保存</button></div>
<label for="restore">バックアップから復元</label><input id="restore" type="file" accept=".json,application/json">
<p class="note">復元すると現在の登録データはバックアップ内容に置き換わります。</p>
</section>

<section class="card"><h2>④ 倉庫向け発注一覧</h2><div id="orders"></div><div id="summary" class="summary"></div></section>

<script>
'use strict';
const $=id=>document.getElementById(id), KEY='jan-stock-app-v1';
let items={};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))items=x}catch(e){}
let scanner=null,running=false,locked=false;
const digits=s=>String(s||'').replace(/\\D/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=(id,s)=>$(id).textContent=s;
function saveAll(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function lookup(){
 const j=digits($('jan').value);$('jan').value=j;
 if(!j){status('formStatus','JANコードを入力してください');return}
 const p=items[j];
 $('name').value=p?.name||'';$('stock').value=Number(p?.stock)||0;$('order').value=Number(p?.order)||0;
 status('formStatus',p?'登録済みの商品です。内容を確認して更新できます':'未登録の商品です。商品名を入力してください');
}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=1000;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.1);o.onended=()=>c.close()}catch(e){}}
async function startScan(){
 if(!window.Html5Qrcode){status('scanStatus','スキャン機能を読み込めません。JANを直接入力してください');return}
 $('reader').hidden=false;
 if(!scanner)scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]});
 try{
  if(running){locked=false;scanner.resume()}
  else{
   await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:300,height:130},videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},text=>{
    if(locked)return;const code=digits(text);if(!code)return;locked=true;beep();$('jan').value=code;lookup();try{scanner.pause(true)}catch(e){}
    $('nextBtn').disabled=false;$('closeBtn').disabled=false;status('scanStatus','読み取りました：'+code+' ／ 商品情報を確認してください');
   },()=>{});
   running=true;locked=false;
  }
  $('nextBtn').disabled=false;$('closeBtn').disabled=false;status('scanStatus','カメラ起動中。JANコードをかざしてください');
 }catch(e){status('scanStatus','カメラを起動できません。カメラの許可とHTTPS接続を確認してください');$('reader').hidden=true}
}
async function closeScan(){if(scanner&&running){try{await scanner.stop()}catch(e){}running=false}locked=false;$('reader').hidden=true;$('nextBtn').disabled=true;$('closeBtn').disabled=true;status('scanStatus','カメラを閉じました')}
function clearForm(){$('jan').value='';$('name').value='';$('stock').value=0;$('order').value=0;status('formStatus','')}
function saveProduct(){
 const j=digits($('jan').value),n=$('name').value.trim(),s=Number($('stock').value),o=Number($('order').value);
 if(!j)return status('formStatus','JANコードを入力してください');if(!n)return status('formStatus','商品名を入力してください');
 if(!Number.isFinite(s)||s<0||!Number.isFinite(o)||o<0)return status('formStatus','在庫数と発注数は0以上で入力してください');
 items[j]={name:n,stock:Math.floor(s),order:Math.floor(o)};saveAll();status('formStatus','保存しました');
 if(scanner&&running){locked=false;try{scanner.resume()}catch(e){}status('scanStatus','次の商品を読み取れます')}
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const list=Object.entries(items).filter(([j,p])=>j.includes(q)||String(p.name||'').toLowerCase().includes(q)).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name),'ja'));
 $('products').innerHTML=list.length?list.map(([j,p])=>`<div class="product"><strong>${esc(p.name)}</strong><div class="meta">JAN：${esc(j)}<br>在庫：${Number(p.stock)||0} ／ 発注：${Number(p.order)||0}</div><div class="product-actions"><button class="secondary" data-edit="${esc(j)}">編集</button><button class="danger" data-del="${esc(j)}">削除</button></div></div>`).join(''):'<div class="empty">登録商品はありません</div>';
 const ord=Object.entries(items).map(([jan,p])=>({jan,name:p.name||'',qty:Math.max(0,Math.floor(Number(p.order)||0))})).filter(p=>p.qty>0).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
 $('orders').innerHTML=ord.length?ord.map(p=>`<div class="product"><strong>${esc(p.name)}</strong><div class="meta">JAN：${esc(p.jan)}<br>発注数：<b>${p.qty} 個</b></div></div>`).join(''):'<div class="empty">発注商品はありません</div>';
 $('summary').textContent=`合計商品数：${ord.length}種類 ／ 合計発注数：${ord.reduce((a,p)=>a+p.qty,0)}個`;
}
function download(name,data,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('scanBtn').onclick=startScan;$('nextBtn').onclick=()=>{if(scanner&&running){locked=false;try{scanner.resume()}catch(e){}status('scanStatus','次のJANコードをかざしてください')}};
$('closeBtn').onclick=closeScan;$('lookupBtn').onclick=lookup;$('jan').onchange=lookup;$('saveBtn').onclick=saveProduct;$('clearBtn').onclick=clearForm;$('search').oninput=render;
$('products').onclick=e=>{
 const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');
 if(ed){$('jan').value=ed.dataset.edit;lookup();window.scrollTo({top:0,behavior:'smooth'})}
 if(del){const j=del.dataset.del;if(confirm('この商品を削除しますか？')){delete items[j];saveAll();if($('jan').value===j)clearForm()}}
};
$('csvBtn').onclick=()=>{const rows=[['JANコード','商品名','在庫数','発注数'],...Object.entries(items).map(([j,p])=>[j,p.name,p.stock||0,p.order||0])];const csv='\\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n');download('jan-stock.csv',csv,'text/csv;charset=utf-8')};
$('backupBtn').onclick=()=>download('jan-stock-backup.json',JSON.stringify(items,null,2),'application/json');
$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||typeof d!=='object'||Array.isArray(d))throw 0;if(confirm('現在の登録データをバックアップ内容に置き換えますか？')){const clean={};for(const [j,p] of Object.entries(d)){const k=digits(j);if(k&&p&&typeof p==='object')clean[k]={name:String(p.name||''),stock:Math.max(0,Math.floor(Number(p.stock)||0)),order:Math.max(0,Math.floor(Number(p.order)||0))}}items=clean;saveAll();status('formStatus','バックアップから復元しました')}}catch(e){alert('バックアップファイルを読み込めませんでした')}finally{e.target.value=''}};
render();
</script>
</body></html>
